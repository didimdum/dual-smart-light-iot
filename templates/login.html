<!DOCTYPE html>
<html>
<head>
    <title>Login - Dual Smart Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CSS Tambahan Khusus untuk Posisi & Styling Ikon Mata */
        .password-container {
            position: relative;
            width: 100%;
        }
        .password-container .form-control {
            width: 100%;
            padding-right: 45px; /* Memberikan ruang agar teks tidak menabrak ikon */
        }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }
        .toggle-password:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='abstract-blue-smoke.1920x1080.mp4') }}" type="video/mp4">
    </video>
    <div class="noise-overlay"></div>

    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
            <!-- Ikon SVG Vektor Bersih -->
            <div style="display: inline-flex; justify-content: center; align-items: center; width: 50px; height: 50px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; margin-bottom: 15px; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #38bdf8;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h3 style="margin-bottom: 8px;">System Authentication</h3>
            <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 25px; line-height: 1.4;">
                Masuk menggunakan akun yang telah terdaftar untuk mengakses panel kontrol perangkat.
            </p>

            {% if error %}
            <div style="background: rgba(244, 63, 94, 0.2); border: 1px solid rgba(244, 63, 94, 0.5); color: #ffe4e6; padding: 10px; border-radius: 12px; font-size: 0.8rem; text-align: center; margin-bottom: 15px; font-weight: 700;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" style="text-align: left;">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Masukkan username">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" name="password" id="passwordInput" class="form-control" required placeholder="Masukkan password">
                        <span class="toggle-password" onclick="togglePasswordVisibility()">
                            <!-- Ikon Mata Terbuka (Muncul saat password terlihat) -->
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Ikon Mata Dicoret/Tertutup (Default) -->
                            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-submit" style="width: 100%;">MASUK PANEL</button>
            </form>
        </div>
    </div>

    <!-- JavaScript untuk Toggle Password -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            }
        }
    </script>
</body>
</html>
